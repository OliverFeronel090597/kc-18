<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KC@18 - Debut Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0000;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Red & Black Theme */
        :root {
            --primary-red: #dc2626;
            --dark-red: #991b1b;
            --blood-red: #7f1a1a;
            --black: #000000;
            --dark-bg: #0a0000;
            --card-bg: #1a0a0a;
            --accent: #ef4444;
        }

        /* Hero Section - Full Height with Text at Top */
        .hero-section {
            position: relative;
            height: 100vh;
            min-height: 600px;
            background: var(--black);
            overflow: hidden;
        }

        .hero-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(0.85);
            animation: slowZoom 20s ease-in-out infinite;
        }

        @keyframes slowZoom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.7) 100%);
        }

        /* Text Content - Positioned at Top Center */
        .hero-content {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            z-index: 2;
            animation: fadeInDown 1s ease;
            pointer-events: none;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-content h1 {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            text-shadow: 0 0 30px rgba(220,38,38,0.5);
            animation: pulse 2s ease-in-out infinite;
            background: linear-gradient(135deg, #fff, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 20px rgba(220,38,38,0.5); }
            50% { text-shadow: 0 0 40px rgba(220,38,38,0.8); }
        }

        .hero-content p {
            font-size: 1.5rem;
            opacity: 0.95;
            margin-bottom: 1rem;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(220,38,38,0.9);
            backdrop-filter: blur(10px);
            padding: 0.6rem 1.8rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 20px rgba(220,38,38,0.3);
        }

        /* Controls Bar */
        .controls-bar {
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--primary-red);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-red);
            letter-spacing: 1px;
        }

        .button-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(220,38,38,0.4);
        }

        .btn-secondary {
            background: rgba(220,38,38,0.2);
            color: white;
            border: 1px solid rgba(220,38,38,0.5);
        }

        .btn-secondary:hover {
            background: rgba(220,38,38,0.4);
            transform: translateY(-2px);
        }

        .stats {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        /* Sort Bar */
        .sort-bar {
            background: #0f0505;
            padding: 0.8rem 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(220,38,38,0.3);
        }

        .sort-label {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }

        .sort-btn {
            background: transparent;
            border: 1px solid rgba(220,38,38,0.3);
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            transition: all 0.3s ease;
        }

        .sort-btn:hover {
            border-color: var(--primary-red);
            color: white;
        }

        .sort-btn.active {
            background: var(--primary-red);
            border-color: transparent;
            color: white;
        }

        /* Grid View */
        .grid-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .grid-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(220,38,38,0.3);
            animation: fadeInScale 0.5s ease;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .grid-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(220,38,38,0.2);
            border-color: var(--primary-red);
        }

        .card-image {
            position: relative;
            width: 100%;
            padding-top: 75%;
            overflow: hidden;
            background: #0a0000;
        }

        .card-image img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .grid-card:hover .card-image img {
            transform: scale(1.05);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .grid-card:hover .card-overlay {
            opacity: 1;
        }

        .download-card-btn {
            width: 100%;
            background: var(--primary-red);
            border: none;
            padding: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }

        .download-card-btn:hover {
            background: var(--dark-red);
            transform: scale(1.02);
        }

        .card-info {
            position: absolute;
            top: 0.8rem;
            left: 0.8rem;
            right: 0.8rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .card-date {
            background: rgba(220,38,38,0.8);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .card-name {
            background: rgba(0,0,0,0.7);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.65rem;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Fullscreen Modal for Auto-play */
        .fullscreen-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .fullscreen-modal.active {
            display: flex;
        }

        .fullscreen-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fullscreen-image {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            animation: zoomIn 0.5s ease;
            box-shadow: 0 0 50px rgba(220,38,38,0.3);
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .fullscreen-close {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(220,38,38,0.9);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            color: white;
            transition: all 0.3s ease;
            z-index: 2001;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-close:hover {
            background: var(--primary-red);
            transform: scale(1.1);
        }

        .fullscreen-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(220,38,38,0.6);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 2rem;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-nav:hover {
            background: var(--primary-red);
            transform: translateY(-50%) scale(1.1);
        }

        .fullscreen-prev {
            left: 30px;
        }

        .fullscreen-next {
            right: 30px;
        }

        .fullscreen-info {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 1rem;
            background: rgba(0,0,0,0.6);
            padding: 0.8rem;
            margin: 0 auto;
            width: fit-content;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        /* Loading */
        .loading-state {
            text-align: center;
            padding: 4rem;
            color: rgba(255,255,255,0.6);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(220,38,38,0.3);
            border-top-color: var(--primary-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-content {
                top: 20px;
            }
            
            .hero-content h1 {
                font-size: 2.5rem;
            }
            
            .hero-content p {
                font-size: 1rem;
            }
            
            .hero-badge {
                font-size: 0.8rem;
                padding: 0.4rem 1.2rem;
            }
            
            .hero-section {
                height: 70vh;
                min-height: 500px;
            }
            
            .controls-bar {
                padding: 1rem;
            }
            
            .grid-container {
                padding: 1rem;
            }
            
            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1rem;
            }
            
            .fullscreen-nav {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            
            .fullscreen-prev {
                left: 10px;
            }
            
            .fullscreen-next {
                right: 10px;
            }
            
            .fullscreen-close {
                top: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .hero-content h1 {
                font-size: 1.8rem;
            }
            
            .hero-content p {
                font-size: 0.8rem;
            }
            
            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 0.8rem;
            }
        }
    </style>
</head>

        let images = [];
        let currentIndex = 0;
        let autoPlayInterval = null;

        let currentSort = 'date-oldest';
        let audio = null;
        
        // Initialize audio
        function initAudio() {
            audio = new Audio(MUSIC_FILE);
            audio.loop = true;
            audio.volume = 0.5;
        }
        
        function startMusic() {
            if (!audio) {
                initAudio();
            }
            audio.play().catch(e => console.log('Audio play failed:', e));
        }
        
        function stopMusic() {
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
            }
        }
        
        // Get image number for sorting
        function getImageNumber(filename) {
            const match = filename.match(/_DSC(\d+)/i);
            if (match) return parseInt(match[1]);
            return 0;
        }
        
        // Create image objects
        async function createImageObjects() {
            const imageObjects = [];
            for (const name of imageNames) {
                const imageNum = getImageNumber(name);
                imageObjects.push({
                    name: name,
                    timestamp: imageNum,
                    displayDate: `DSC-${String(imageNum).padStart(4, '0')}`
                });
            }
            return imageObjects;
        }
        
        // Sort images
        function sortImages(imagesArray) {
            const sorted = [...imagesArray];
            switch(currentSort) {
                case 'date-oldest':
                    sorted.sort((a, b) => a.timestamp - b.timestamp);
                    break;
                case 'date-newest':
                    sorted.sort((a, b) => b.timestamp - a.timestamp);
                    break;
                case 'name-asc':
                    sorted.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'name-desc':
                    sorted.sort((a, b) => b.name.localeCompare(a.name));
                    break;
            }
            return sorted;
        }
        
        // Display images in grid
        function displayImages(imagesArray) {
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '';
            
            imagesArray.forEach((image, index) => {
                const card = document.createElement('div');
                card.className = 'grid-card';
                card.onclick = () => openFullscreen(index);
                
                card.innerHTML = `
                    <div class="card-image">
                        <img src="${LOW_QUALITY_FOLDER}/${image.name}" alt="${image.name}" loading="lazy">
                        <div class="card-info">
                            <span class="card-date">📅 ${image.displayDate}</span>
                            <span class="card-name">📷 ${image.name}</span>
                        </div>
                        <div class="card-overlay">
                            <button class="download-card-btn" onclick="event.stopPropagation(); downloadOriginal('${image.name}')">
                                📥 Download Original
                            </button>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
            
            document.getElementById('stats').textContent = `📸 ${imagesArray.length} images • ${getSortLabel()}`;
            document.getElementById('imageCount').textContent = `${imagesArray.length} Moments Captured`;
        }
        
        // Load header image
        function loadHeaderImage() {
            const heroImg = document.getElementById('heroImage');
            heroImg.src = `${LOW_QUALITY_FOLDER}/${HEADER_IMAGE}`;
            heroImg.onerror = () => {
                heroImg.src = `${ORIGINAL_FOLDER}/${HEADER_IMAGE}`;
            };
        }
        
        function getSortLabel() {
            switch(currentSort) {
                case 'date-oldest': return 'Oldest First';
                case 'date-newest': return 'Newest First';
                case 'name-asc': return 'A-Z';
                case 'name-desc': return 'Z-A';
                default: return 'Oldest First';
            }
        }
        
        function downloadOriginal(imageName) {
            const link = document.createElement('a');
            link.href = `${ORIGINAL_FOLDER}/${imageName}`;
            link.download = `KC18_${imageName}`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showTempMessage(`⬇️ Downloading: ${imageName}`);
        }
        
        function downloadAllOriginals() {
            if (images.length === 0) return;
            let downloaded = 0;
            images.forEach((image, index) => {
                setTimeout(() => {
                    downloadOriginal(image.name);
                    downloaded++;
                    document.getElementById('stats').textContent = `Downloading: ${downloaded}/${images.length}`;
                    if (downloaded === images.length) {
                        setTimeout(() => {
                            document.getElementById('stats').textContent = `✅ Downloaded all ${images.length} originals`;
                            setTimeout(() => {
                                document.getElementById('stats').textContent = `📸 ${images.length} images • ${getSortLabel()}`;
                            }, 2000);
                        }, 500);
                    }
                }, index * 300);
            });
        }
        
        function showTempMessage(message) {
            const original = document.getElementById('stats').textContent;
            document.getElementById('stats').textContent = message;
            setTimeout(() => {
                document.getElementById('stats').textContent = original;
            }, 1500);
        }
        
        // Fullscreen functions
        function openFullscreen(index) {
            currentIndex = index;
            const modal = document.getElementById('fullscreenModal');
            const img = document.getElementById('fullscreenImage');
            const info = document.getElementById('fullscreenInfo');
            
            img.src = `${LOW_QUALITY_FOLDER}/${images[currentIndex].name}`;
            info.textContent = `${images[currentIndex].name} | ${images[currentIndex].displayDate}`;
            modal.classList.add('active');
        }
        
        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
        }
        
        function nextFullscreen() {
            currentIndex = (currentIndex + 1) % images.length;
            const img = document.getElementById('fullscreenImage');
            const info = document.getElementById('fullscreenInfo');
            img.src = `${LOW_QUALITY_FOLDER}/${images[currentIndex].name}`;
            info.textContent = `${images[currentIndex].name} | ${images[currentIndex].displayDate}`;
        }
        
        function prevFullscreen() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            const img = document.getElementById('fullscreenImage');
            const info = document.getElementById('fullscreenInfo');
            img.src = `${LOW_QUALITY_FOLDER}/${images[currentIndex].name}`;
            info.textContent = `${images[currentIndex].name} | ${images[currentIndex].displayDate}`;
        }
        
        // Auto-play - shows fullscreen, cycles through images, plays music
        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            if (images.length === 0) return;
            
            isAutoPlaying = true;
            
            // Start music
            startMusic();
            
            // Open fullscreen with first image
            openFullscreen(0);
            
            // Start cycling through images every 4 seconds
            autoPlayInterval = setInterval(() => {
                nextFullscreen();
            }, 4000);
            
            document.getElementById('stats').textContent = `🎬 AUTO-PLAY ACTIVE • Playing: One Direction - 18 • Press ✕ to stop`;
        }
        
        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
            isAutoPlaying = false;
            
            // Stop music
            stopMusic();
            
            closeFullscreen();
            document.getElementById('stats').textContent = `📸 ${images.length} images • ${getSortLabel()}`;
        }
        
        async function refreshGallery() {
            document.getElementById('imageGrid').innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading KC@18 Gallery...</p></div>';
            const imageObjects = await createImageObjects();
            const sorted = sortImages(imageObjects);
            images = sorted;
            displayImages(images);
        }
        
        // Event Listeners
        document.getElementById('autoPlayBtn').addEventListener('click', startAutoPlay);
        document.getElementById('downloadAllBtn').addEventListener('click', downloadAllOriginals);
        document.getElementById('refreshBtn').addEventListener('click', refreshGallery);
        document.getElementById('fullscreenClose').addEventListener('click', stopAutoPlay);
        document.getElementById('fullscreenPrev').addEventListener('click', () => {
            prevFullscreen();
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = setInterval(() => nextFullscreen(), 4000);
            }
        });
        document.getElementById('fullscreenNext').addEventListener('click', () => {
            nextFullscreen();
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = setInterval(() => nextFullscreen(), 4000);
            }
        });
        
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const sortType = btn.dataset.sort;
                currentSort = sortType;
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (images.length > 0) {
                    const sorted = sortImages(images);
                    images = sorted;
                    displayImages(images);
                    if (isAutoPlaying) stopAutoPlay();
                }
            });
        });
        
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('fullscreenModal');
            if (modal.classList.contains('active')) {
                if (e.key === 'ArrowLeft') prevFullscreen();
                if (e.key === 'ArrowRight') nextFullscreen();
                if (e.key === 'Escape') stopAutoPlay();
            }
        });
        
        // Initialize
        loadHeaderImage();
        refreshGallery();
        initAudio();
    </script>
</body>
</html>
